<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e9ecef;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        h1 {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            margin: 0;
            font-size: 28px;
            color: #222;
            z-index: 10;
        }
    </style>
</head>

<body>

<h1>Auto Cuber</h1>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9ecef);

    // Camera
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(4, 4, 6);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Spacing between cubies
    const spacing = 1.05;

    // Store all cubies
    const cubies = [];

    // Create one cubie
    function createCubie(x, y, z) {
        const geometry = new THREE.BoxGeometry(1, 1, 1);

        const materials = [
            new THREE.MeshBasicMaterial({ color: 0xff0000 }), // right (+x)
            new THREE.MeshBasicMaterial({ color: 0xffa500 }), // left (-x)
            new THREE.MeshBasicMaterial({ color: 0xffffff }), // top (+y)
            new THREE.MeshBasicMaterial({ color: 0xffff00 }), // bottom (-y)
            new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // front (+z)
            new THREE.MeshBasicMaterial({ color: 0x0000ff })  // back (-z)
        ];

        const cube = new THREE.Mesh(geometry, materials);

        cube.position.set(x * spacing, y * spacing, z * spacing);

        return cube;
    }

    // Build 3×3×3 cube (27 pieces)
    for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
            for (let z = -1; z <= 1; z++) {
                const cubie = createCubie(x, y, z);
                scene.add(cubie);
                cubies.push(cubie);
            }
        }
    }

    // Simple render loop (for future animation)
    function animate() {
        requestAnimationFrame(animate);

        // optional slow rotation so you can see it better
        scene.rotation.y += 0.003;

        renderer.render(scene, camera);
    }
    animate();

    // Resize support
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html><script>
    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9ecef); // light background

    // Camera
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(3, 3, 5);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Rubik's Cube colors (face order matters!)
    const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }), // right  (+x) red
        new THREE.MeshBasicMaterial({ color: 0xffa500 }), // left   (-x) orange
        new THREE.MeshBasicMaterial({ color: 0xffffff }), // top    (+y) white
        new THREE.MeshBasicMaterial({ color: 0xffff00 }), // bottom (-y) yellow
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // front  (+z) green
        new THREE.MeshBasicMaterial({ color: 0x0000ff })  // back   (-z) blue
    ];

    // Cube
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    // Render once (no animation / no rotation)
    renderer.render(scene, camera);

    // Resize support
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);
    });
</script>

</body>
</html>
