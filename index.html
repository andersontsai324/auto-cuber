<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e9ecef;
        }
        canvas { display: block; }
    </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4,4,6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const spacing = 1.05;
const cubies = [];

function createCubie(x,y,z){
    const geometry = new THREE.BoxGeometry(1,1,1);

    const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }),
        new THREE.MeshBasicMaterial({ color: 0xffa500 }),
        new THREE.MeshBasicMaterial({ color: 0xffffff }),
        new THREE.MeshBasicMaterial({ color: 0xffff00 }),
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }),
        new THREE.MeshBasicMaterial({ color: 0x0000ff })
    ];

    const cube = new THREE.Mesh(geometry, materials);
    cube.position.set(x*spacing, y*spacing, z*spacing);
    return cube;
}

// build cube
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){
    const c = createCubie(x,y,z);
    scene.add(c);
    cubies.push(c);
}}}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;
let selected = null;
let pivot = null;
let active = [];
let face = null;
let start = null;
let currentAngle = 0;

// ---------------- FACE DETECTION ----------------
function getFace(cube){
    const x = Math.round(cube.position.x / spacing);
    const y = Math.round(cube.position.y / spacing);
    const z = Math.round(cube.position.z / spacing);

    if(x===1) return "x+";
    if(x===-1) return "x-";
    if(y===1) return "y+";
    if(y===-1) return "y-";
    if(z===1) return "z+";
    if(z===-1) return "z-";
}

// ---------------- MOUSE DOWN ----------------
window.addEventListener("mousedown",(e)=>{
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(cubies);
    if(!hits.length) return;

    selected = hits[0].object;
    face = getFace(selected);

    start = { x:e.clientX, y:e.clientY };
    dragging = true;
});

// ---------------- AXIS DECISION ----------------
function getRotationAxis(face, dx, dy){

    const horizontal = Math.abs(dx) > Math.abs(dy);

    // X FACE
    if(face.startsWith("x")){
        return horizontal ? "y" : "z";
    }

    // Y FACE
    if(face.startsWith("y")){
        return horizontal ? "x" : "z";
    }

    // Z FACE
    if(face.startsWith("z")){
        return horizontal ? "x" : "y";
    }
}

// ---------------- MOVE ----------------
window.addEventListener("mousemove",(e)=>{
    if(!dragging || !selected) return;

    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;

    if(!pivot){
        pivot = new THREE.Object3D();
        scene.add(pivot);

        const x = Math.round(selected.position.x / spacing);
        const y = Math.round(selected.position.y / spacing);
        const z = Math.round(selected.position.z / spacing);

        active = [];

        for(let c of cubies){
            const cx = Math.round(c.position.x / spacing);
            const cy = Math.round(c.position.y / spacing);
            const cz = Math.round(c.position.z / spacing);

            if(
                (face.startsWith("x") && cx===x) ||
                (face.startsWith("y") && cy===y) ||
                (face.startsWith("z") && cz===z)
            ){
                active.push(c);
                pivot.attach(c);
            }
        }
    }

    const axis = getRotationAxis(face, dx, dy);

    let angle = 0.005 * (Math.abs(dx) > Math.abs(dy) ? dx : dy);

    pivot.rotation[axis] = angle;
    currentAngle = angle;
});

// ---------------- MOUSE UP ----------------
window.addEventListener("mouseup",()=>{
    if(!dragging) return;

    const snap = Math.round(currentAngle/(Math.PI/2))*(Math.PI/2);

    if(pivot){
        const axis = Object.keys(pivot.rotation).find(k => pivot.rotation[k] !== 0);

        pivot.rotation[axis] = snap;

        for(let c of active){
            scene.attach(c);

            c.position.x = Math.round(c.position.x / spacing)*spacing;
            c.position.y = Math.round(c.position.y / spacing)*spacing;
            c.position.z = Math.round(c.position.z / spacing)*spacing;
        }

        scene.remove(pivot);
    }

    dragging = false;
    selected = null;
    pivot = null;
    active = [];
});

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
