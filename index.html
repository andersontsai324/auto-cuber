<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }
        #controls {
            position: fixed; top: 16px; left: 16px; z-index: 10;
            display: flex; gap: 10px;
        }
        #controls button {
            padding: 10px 18px;
            font: 600 15px system-ui, -apple-system, sans-serif;
            color: #fff; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        #scrambleBtn { background: #339af0; }
        #scrambleBtn:hover { background: #1c7ed6; }
        #solveBtn { background: #51cf66; }
        #solveBtn:hover { background: #37b24d; }
        #controls button:disabled { background: #adb5bd; cursor: default; }
    </style>
</head>
<body>

<div id="controls">
    <button id="scrambleBtn">Scramble</button>
    <button id="solveBtn">Solve</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const spacing = 1.05;
const cubies = [];

function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];
                        
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    mesh.userData = { x, y, z };
    return mesh;
}

for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue;
            const c = createCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragStage = "IDLE"; 
let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let startMouse = new THREE.Vector2();
let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
let pivot = new THREE.Object3D();
let currentAngle = 0;

// --- Whole-cube orbit (camera) state ---
const spherical = new THREE.Spherical();
const ORBIT_SPEED = 0.01;
const PHI_EPS = 0.05; // keeps the camera from flipping at the poles

// --- Scramble / programmatic-turn state ---
let isBusy = false;     // locks mouse input while the cube is auto-turning
const turnQueue = [];   // pending { axis, layer, dir } moves to play out
let activeTurn = null;  // the turn currently being animated
const TURN_STEPS = 9;   // animation frames per 90° turn (smaller = faster)
const history = [];     // every turn taken (scramble + manual), for the solver to reverse
let pendingAxisKey = 'x'; // axis of the manual turn currently in progress
let pendingLayer = 0;     // which layer (-1/0/1) that manual turn is on

window.addEventListener("mousedown", (e) => {
    if (e.target !== renderer.domElement) return; // ignore clicks on UI (e.g. the button)
    if (isBusy) return;                           // ignore input while auto-turning
    if (dragStage !== "IDLE") return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);

    if (hits.length === 0) {
        // Clicked empty space -> orbit the entire cube (move the camera around it)
        dragStage = "ORBITING";
        startMouse.set(e.clientX, e.clientY);
        spherical.setFromVector3(camera.position);
        window.addEventListener("mousemove", handleOrbitDrag);
        return;
    }

    dragStage = "INITIATING";
    selectedCubie = hits[0].object;
    selectedFaceNormal.copy(hits[0].face.normal).applyQuaternion(selectedCubie.quaternion).normalize();
    startMouse.set(e.clientX, e.clientY);
});

window.addEventListener("mousemove", (e) => {
    if (dragStage !== "INITIATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 10) return;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

    const rawRotAxis = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();

    const axes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    let maxDot = -1;
    let bestAxis = new THREE.Vector3();

    axes.forEach(axis => {
        const dot = Math.abs(rawRotAxis.dot(axis));
        if (dot > maxDot) {
            maxDot = dot;
            bestAxis.copy(axis).multiplyScalar(Math.sign(rawRotAxis.dot(axis)));
        }
    });

    rotationAxis.copy(bestAxis);

    scene.add(pivot);
    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();

    let coordKey = 'x';
    if (Math.abs(rotationAxis.y) > 0.9) coordKey = 'y';
    if (Math.abs(rotationAxis.z) > 0.9) coordKey = 'z';

    const targetVal = Math.round(selectedCubie.position[coordKey] / spacing) * spacing;

    pendingAxisKey = coordKey;
    pendingLayer = Math.round(targetVal / spacing);

    rotationGroup = [];
    cubies.forEach(c => {
        const currentVal = Math.round(c.position[coordKey] / spacing) * spacing;
        if (Math.abs(currentVal - targetVal) < 0.1) {
            rotationGroup.push(c);
            pivot.attach(c);
        }
    });

    currentAngle = 0;
    dragStage = "ROTATING";
    window.addEventListener("mousemove", handleRotationDrag);
});

function handleRotationDrag(e) {
    if (dragStage !== "ROTATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);

    const tangentDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
    const dragAmt = dragWorldDir.dot(tangentDir);

    currentAngle = dragAmt * 0.005;
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, currentAngle);
}

window.addEventListener("mouseup", () => {
    window.removeEventListener("mousemove", handleRotationDrag);
    window.removeEventListener("mousemove", handleOrbitDrag);
    
    if (dragStage !== "ROTATING") {
        dragStage = "IDLE";
        return;
    }

    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);

    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, snappedAngle);
    pivot.updateMatrixWorld();

    rotationGroup.forEach(c => {
        scene.attach(c);
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
    });

    scene.remove(pivot);
    rotationGroup = [];
    dragStage = "IDLE";

    // Record this manual turn so the solver can undo it later.
    // Express it as quarter turns about the POSITIVE axis (matching the turn engine).
    const s = Math.sign(rotationAxis[pendingAxisKey]) || 1;
    const n = Math.round(snappedAngle * s / (Math.PI / 2)); // signed # of quarter turns
    if (n !== 0) {
        const dir = n > 0 ? 1 : -1;
        for (let i = 0; i < Math.abs(n); i++) {
            history.push({ axis: pendingAxisKey, layer: pendingLayer, dir });
        }
        refreshButtons();
    }
});

function handleOrbitDrag(e) {
    if (dragStage !== "ORBITING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    startMouse.set(e.clientX, e.clientY); // incremental delta each frame

    spherical.theta -= dx * ORBIT_SPEED;
    spherical.phi   -= dy * ORBIT_SPEED;
    spherical.phi = Math.max(PHI_EPS, Math.min(Math.PI - PHI_EPS, spherical.phi));

    camera.position.setFromSpherical(spherical);
    camera.lookAt(0, 0, 0);
}

// Start the next queued turn (or release the lock when the queue is empty)
function startNextTurn() {
    if (activeTurn) return;
    if (turnQueue.length === 0) {
        isBusy = false;
        refreshButtons();
        return;
    }

    const move = turnQueue.shift();
    const axisVec = new THREE.Vector3(
        move.axis === 'x' ? 1 : 0,
        move.axis === 'y' ? 1 : 0,
        move.axis === 'z' ? 1 : 0
    );

    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();
    scene.add(pivot);

    // Grab every cubie sitting in the layer we're about to turn
    const group = [];
    cubies.forEach(c => {
        const layerVal = Math.round(c.position[move.axis] / spacing);
        if (layerVal === move.layer) {
            group.push(c);
            pivot.attach(c);
        }
    });

    activeTurn = {
        axisVec,
        group,
        target: move.dir * (Math.PI / 2),
        done: 0,
        stepMag: (Math.PI / 2) / TURN_STEPS
    };
}

// Advance the current turn a little each frame; snap & finish when it hits 90°
function updateTurn() {
    if (!activeTurn) return;
    const t = activeTurn;
    const dir = Math.sign(t.target);

    let next = t.done + dir * t.stepMag;
    if (Math.abs(next) >= Math.abs(t.target)) next = t.target; // clamp to exact 90°
    t.done = next;

    pivot.rotation.set(0, 0, 0);
    pivot.rotateOnAxis(t.axisVec, t.done);

    if (t.done === t.target) {
        pivot.updateMatrixWorld();
        t.group.forEach(c => {
            scene.attach(c);
            c.position.x = Math.round(c.position.x / spacing) * spacing;
            c.position.y = Math.round(c.position.y / spacing) * spacing;
            c.position.z = Math.round(c.position.z / spacing) * spacing;
        });
        scene.remove(pivot);
        pivot.rotation.set(0, 0, 0);
        activeTurn = null;
        startNextTurn(); // chain into the next queued turn
    }
}

// Queue up a random sequence of legal turns. Any such sequence is always solvable.
function scramble(moves = 25) {
    if (isBusy || dragStage !== "IDLE") return; // don't interrupt an in-progress turn
    isBusy = true;
    refreshButtons();

    const axes = ['x', 'y', 'z'];
    const layers = [-1, 0, 1];
    let lastAxis = null;

    for (let i = 0; i < moves; i++) {
        let axis;
        do { axis = axes[Math.floor(Math.random() * 3)]; } while (axis === lastAxis);
        lastAxis = axis; // avoid back-to-back turns on the same axis (looks better)
        const layer = layers[Math.floor(Math.random() * 3)];
        const dir = Math.random() < 0.5 ? 1 : -1;
        const move = { axis, layer, dir };
        turnQueue.push(move);
        history.push(move); // remember it so Solve can reverse it
    }
    startNextTurn();
}

const scrambleBtn = document.getElementById('scrambleBtn');
const solveBtn = document.getElementById('solveBtn');

function refreshButtons() {
    scrambleBtn.disabled = isBusy;
    solveBtn.disabled = isBusy || history.length === 0;
}

// Solve by replaying every recorded turn in reverse order, each one inverted.
// Undoing the full move history always returns the cube to solved.
function solve() {
    if (isBusy || dragStage !== "IDLE" || history.length === 0) return;
    isBusy = true;
    refreshButtons();
    for (let i = history.length - 1; i >= 0; i--) {
        const m = history[i];
        turnQueue.push({ axis: m.axis, layer: m.layer, dir: -m.dir });
    }
    history.length = 0; // the queued turns bring us back to solved
    startNextTurn();
}

scrambleBtn.addEventListener('click', () => scramble(25));
solveBtn.addEventListener('click', solve);
refreshButtons();

function animate() {
    requestAnimationFrame(animate);
    updateTurn();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
