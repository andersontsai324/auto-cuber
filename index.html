<!DOCTYPE html>
<html>
<head>
<title>Rubik Smooth</title>
<style>
body { margin:0; overflow:hidden; background:#e9ecef; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(4,4,6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const spacing = 1.05;
const cubies = [];

function createCubie(x,y,z){
    const geo = new THREE.BoxGeometry(1,1,1);

    const mats = [
        new THREE.MeshBasicMaterial({color:0xff0000}),
        new THREE.MeshBasicMaterial({color:0xffa500}),
        new THREE.MeshBasicMaterial({color:0xffffff}),
        new THREE.MeshBasicMaterial({color:0xffff00}),
        new THREE.MeshBasicMaterial({color:0x00ff00}),
        new THREE.MeshBasicMaterial({color:0x0000ff})
    ];

    const c = new THREE.Mesh(geo, mats);
    c.position.set(x*spacing,y*spacing,z*spacing);
    return c;
}

// build cube
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){
    const c = createCubie(x,y,z);
    scene.add(c);
    cubies.push(c);
}}}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;
let selected = null;
let pivot = null;
let active = [];
let face = null;
let start = null;

let axis = null;
let animating = false;

// ---------------- FACE ----------------
function getFace(c){
    const x=Math.round(c.position.x/spacing);
    const y=Math.round(c.position.y/spacing);
    const z=Math.round(c.position.z/spacing);

    if(x===1) return "+x";
    if(x===-1) return "-x";
    if(y===1) return "+y";
    if(y===-1) return "-y";
    if(z===1) return "+z";
    if(z===-1) return "-z";
}

// ---------------- AXIS ----------------
function pickAxis(face, dx, dy){
    const horizontal = Math.abs(dx) > Math.abs(dy);

    if(face.includes("x")) return horizontal ? "y" : "z";
    if(face.includes("y")) return horizontal ? "x" : "z";
    if(face.includes("z")) return horizontal ? "x" : "y";
}

// ---------------- START ----------------
window.addEventListener("mousedown",(e)=>{
    if(animating) return;

    mouse.x = (e.clientX/innerWidth)*2-1;
    mouse.y = -(e.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(cubies);
    if(!hits.length) return;

    selected = hits[0].object;
    face = getFace(selected);
    start = {x:e.clientX, y:e.clientY};

    dragging = true;

    pivot = new THREE.Object3D();
    scene.add(pivot);

    const x=Math.round(selected.position.x/spacing);
    const y=Math.round(selected.position.y/spacing);
    const z=Math.round(selected.position.z/spacing);

    active = [];

    for(let c of cubies){
        const cx=Math.round(c.position.x/spacing);
        const cy=Math.round(c.position.y/spacing);
        const cz=Math.round(c.position.z/spacing);

        if(
            (face.includes("x") && cx===x) ||
            (face.includes("y") && cy===y) ||
            (face.includes("z") && cz===z)
        ){
            active.push(c);
            pivot.attach(c);
        }
    }
});

// ---------------- MOVE ----------------
window.addEventListener("mousemove",(e)=>{
    if(!dragging || !pivot) return;

    const dx = e.clientX - start.x;
    const dy = e.clientY - start.y;

    if(axis === null){
        axis = pickAxis(face, dx, dy);
    }
});

// ---------------- ANIMATED TURN ----------------
function animateTurn(targetAngle){
    animating = true;

    const duration = 200;
    const startTime = performance.now();
    const startAngle = pivot.rotation[axis] || 0;

    function step(t){
        const progress = Math.min((t - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3); // smooth ease-out

        pivot.rotation[axis] = startAngle + (targetAngle - startAngle) * eased;

        if(progress < 1){
            requestAnimationFrame(step);
        } else {
            finalizeTurn();
        }
    }

    requestAnimationFrame(step);
}

// ---------------- FINALIZE ----------------
function finalizeTurn(){
    const snap = Math.round(pivot.rotation[axis] / (Math.PI/2)) * (Math.PI/2);
    pivot.rotation[axis] = snap;

    for(let c of active){
        scene.attach(c);

        c.position.x = Math.round(c.position.x/spacing)*spacing;
        c.position.y = Math.round(c.position.y/spacing)*spacing;
        c.position.z = Math.round(c.position.z/spacing)*spacing;

        c.rotation.set(0,0,0);
        c.updateMatrixWorld(true);
    }

    scene.remove(pivot);

    pivot = null;
    active = [];
    axis = null;
    animating = false;
}

// ---------------- RELEASE ----------------
window.addEventListener("mouseup",()=>{
    if(!dragging || !pivot) return;

    const dx = event.clientX - start.x;
    const dy = event.clientY - start.y;

    const move = (axis === "x" ? dx : dy);
    const target = Math.round(move / 80) * (Math.PI/2);

    animateTurn(target);

    dragging = false;
    selected = null;
});

// ---------------- LOOP ----------------
function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
