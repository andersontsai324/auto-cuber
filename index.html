<!DOCTYPE html>
<html>
<head>
<title>Auto Cuber!</title>
<style>
body { margin:0; overflow:hidden; background:#e9ecef; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(4,4,6);
camera.lookAt(0,0,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const spacing = 1.05;
const cubies = [];

function createCubie(x,y,z){
    const geo = new THREE.BoxGeometry(1,1,1);

    const mats = [
        new THREE.MeshBasicMaterial({color:0xff0000}),
        new THREE.MeshBasicMaterial({color:0xffa500}),
        new THREE.MeshBasicMaterial({color:0xffffff}),
        new THREE.MeshBasicMaterial({color:0xffff00}),
        new THREE.MeshBasicMaterial({color:0x00ff00}),
        new THREE.MeshBasicMaterial({color:0x0000ff})
    ];

    const c = new THREE.Mesh(geo, mats);
    c.position.set(x*spacing,y*spacing,z*spacing);
    return c;
}

// build cube
for(let x=-1;x<=1;x++){
for(let y=-1;y<=1;y++){
for(let z=-1;z<=1;z++){
    const c = createCubie(x,y,z);
    scene.add(c);
    cubies.push(c);
}}}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;
let selected = null;
let pivot = null;
let active = [];
let faceNormal = new THREE.Vector3();

let startMouse = new THREE.Vector2();
let moveVec = new THREE.Vector2();

let axis = null;

// ---------------- FACE NORMAL ----------------
function getFaceNormal(obj){
    const x = Math.round(obj.position.x / spacing);
    const y = Math.round(obj.position.y / spacing);
    const z = Math.round(obj.position.z / spacing);

    if(x === 1) return new THREE.Vector3(1,0,0);
    if(x === -1) return new THREE.Vector3(-1,0,0);
    if(y === 1) return new THREE.Vector3(0,1,0);
    if(y === -1) return new THREE.Vector3(0,-1,0);
    if(z === 1) return new THREE.Vector3(0,0,1);
    return new THREE.Vector3(0,0,-1);
}

// ---------------- PROJECT DRAG (IMPORTANT FIX) ----------------
function getDragVector(e){
    const dx = (e.clientX - startMouse.x);
    const dy = (e.clientY - startMouse.y);

    // camera-relative axes (prevents diagonal junk)
    const right = new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);

    return right.multiplyScalar(dx).add(up.multiplyScalar(-dy));
}

// ---------------- START ----------------
window.addEventListener("mousedown",(e)=>{

    mouse.x = (e.clientX/innerWidth)*2-1;
    mouse.y = -(e.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(cubies);
    if(!hits.length) return;

    selected = hits[0].object;
    faceNormal = getFaceNormal(selected);

    startMouse.set(e.clientX, e.clientY);

    pivot = new THREE.Object3D();
    scene.add(pivot);

    const x = Math.round(selected.position.x / spacing);
    const y = Math.round(selected.position.y / spacing);
    const z = Math.round(selected.position.z / spacing);

    active = [];

    for(let c of cubies){
        const cx = Math.round(c.position.x / spacing);
        const cy = Math.round(c.position.y / spacing);
        const cz = Math.round(c.position.z / spacing);

        if(
            (faceNormal.x && cx === x) ||
            (faceNormal.y && cy === y) ||
            (faceNormal.z && cz === z)
        ){
            active.push(c);
            pivot.attach(c);
        }
    }

    dragging = true;
});

// ---------------- MOVE (NO DIAGONAL SPIN BUG FIXED HERE) ----------------
window.addEventListener("mousemove",(e)=>{
    if(!dragging || !pivot) return;

    const drag = getDragVector(e);

    // lock axis based on face normal
    if(!axis){
        if(Math.abs(faceNormal.x)) axis = "y";
        else if(Math.abs(faceNormal.y)) axis = "x";
        else axis = "x";
    }

    const amount = drag.length() * 0.002;

    // direction fix using sign of dominant axis
    const sign = (drag.x + drag.y) > 0 ? 1 : -1;

    pivot.rotation[axis] = amount * sign;
});

// ---------------- RELEASE ----------------
window.addEventListener("mouseup",()=>{
    if(!dragging || !pivot) return;

    // snap clean 90°
    const snap = Math.round(pivot.rotation[axis] / (Math.PI/2)) * (Math.PI/2);
    pivot.rotation[axis] = snap;

    for(let c of active){
        scene.attach(c);

        c.position.x = Math.round(c.position.x/spacing)*spacing;
        c.position.y = Math.round(c.position.y/spacing)*spacing;
        c.position.z = Math.round(c.position.z/spacing)*spacing;

        c.rotation.set(0,0,0);
        c.updateMatrixWorld(true);
    }

    scene.remove(pivot);

    dragging = false;
    selected = null;
    pivot = null;
    active = [];
    axis = null;
});

// ---------------- LOOP ----------------
function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
