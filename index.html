<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }
    </style>
</head>
<body>

<!-- FIXED: Replaced invalid cloudflare link with valid CDN links for Three.js -->
<script src="https://cloudflare.com"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const spacing = 1.05;
const cubies = [];

function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];                     
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    // Keep tracking reference properties intact
    mesh.userData = { x, y, z };
    return mesh;
}

for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue;
            const c = createCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragStage = "IDLE";

let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let startMouse = new THREE.Vector2();
let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
const pivot = new THREE.Object3D();
scene.add(pivot);
let currentAngle = 0;

window.addEventListener("mousedown", (e) => {
    if (dragStage !== "IDLE") return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;                     
    
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);                     
    
    if (hits.length === 0) return;                     
    
    dragStage = "INITIATING";        
    selectedCubie = hits[0].object;         
    
    const normalMatrix = new THREE.Matrix3().getNormalMatrix(selectedCubie.matrixWorld);
    selectedFaceNormal.copy(hits[0].face.normal).applyMatrix3(normalMatrix).normalize();                     
    
    startMouse.set(e.clientX, e.clientY);
});

window.addEventListener("mousemove", (e) => {
    if (dragStage === "IDLE") return;

    if (dragStage === "INITIATING") {
        const dx = e.clientX - startMouse.x;
        const dy = e.clientY - startMouse.y;
        const distance = Math.sqrt(dx * dx + dy * dy);                                 
        
        if (distance < 10) return;                               

        const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
        const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
        const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

        const rawRotAxis = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();                        
        
        const axes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
        let maxDot = -1;
        let chosenAxis = new THREE.Vector3();

        axes.forEach(axis => {
            const dot = Math.abs(rawRotAxis.dot(axis));
            if (dot > maxDot) {
                maxDot = dot;
                chosenAxis.copy(axis).multiplyScalar(Math.sign(rawRotAxis.dot(axis)));
            }
        });

        rotationAxis.copy(chosenAxis);

        let coordKey = 'x';
        if (Math.abs(rotationAxis.y) > 0.9) coordKey = 'y';
        if (Math.abs(rotationAxis.z) > 0.9) coordKey = 'z';

        // FIXED: Use a tolerance check on the rounded position coordinate to find the exact global slice plane.
        const targetVal = Math.round(selectedCubie.position[coordKey] / spacing) * spacing;                        
        
        rotationGroup = [];
        pivot.position.set(0, 0, 0);
        pivot.rotation.set(0, 0, 0);
        pivot.updateMatrixWorld();

        cubies.forEach(c => {
            const currentVal = Math.round(c.position[coordKey] / spacing) * spacing;
            if (Math.abs(currentVal - targetVal) < 0.1) {
                rotationGroup.push(c);
                pivot.attach(c);
            }
        });

        dragStage = "ROTATING";
    }

    if (dragStage === "ROTATING") {
        const dx = e.clientX - startMouse.x;
        const dy = e.clientY - startMouse.y;                        
        
        const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
        const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
        const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);                        
        
        const expectedDragDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
        const travel = dragWorldDir.dot(expectedDragDir);                        
        
        currentAngle = travel * 0.01;                         
        
        pivot.rotation.set(0, 0, 0);
        pivot.rotateOnAxis(rotationAxis, currentAngle);
    }
});

window.addEventListener("mouseup", () => {
    if (dragStage !== "ROTATING") {
        dragStage = "IDLE";
        return;
    }

    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);
    pivot.rotation.set(0, 0, 0);
    pivot.rotateOnAxis(rotationAxis, snappedAngle);
    pivot.updateMatrixWorld();

    while (rotationGroup.length > 0) {
        const c = rotationGroup.pop();
        scene.attach(c);
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
    }

    currentAngle = 0;
    dragStage = "IDLE";
    selectedCubie = null;
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
