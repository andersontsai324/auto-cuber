<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e9ecef;
        }
        canvas { display: block; }
    </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const spacing = 1.05;
const cubies = [];

// -------------------- CREATE CUBIES --------------------
function createCubie(x, y, z) {
    const geometry = new THREE.BoxGeometry(1, 1, 1);

    const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }), // right
        new THREE.MeshBasicMaterial({ color: 0xffa500 }), // left
        new THREE.MeshBasicMaterial({ color: 0xffffff }), // top
        new THREE.MeshBasicMaterial({ color: 0xffff00 }), // bottom
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // front
        new THREE.MeshBasicMaterial({ color: 0x0000ff })  // back
    ];

    const cube = new THREE.Mesh(geometry, materials);

    cube.position.set(x * spacing, y * spacing, z * spacing);

    return cube;
}

// build cube
for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
            const c = createCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
        }
    }
}

// -------------------- ROTATION CORE --------------------
let rotating = false;

function rotateLayer(axis, value, angle) {
    if (rotating) return;
    rotating = true;

    const pivot = new THREE.Object3D();
    scene.add(pivot);

    const toRotate = [];

    // pick cubies in layer
    for (let c of cubies) {
        if (Math.abs(c.position[axis] - value * spacing) < 0.01) {
            toRotate.push(c);
            pivot.add(c);
        }
    }

    const duration = 250;
    const start = performance.now();

    function animateRotation(time) {
        let t = (time - start) / duration;
        if (t > 1) t = 1;

        pivot.rotation[axis] = angle * t;

        if (t < 1) {
            requestAnimationFrame(animateRotation);
        } else {
            // finalize
            pivot.rotation[axis] = angle;

            // detach back to scene
            for (let c of toRotate) {
                scene.add(c);

                // round position to avoid floating errors
                c.position.x = Math.round(c.position.x / spacing) * spacing;
                c.position.y = Math.round(c.position.y / spacing) * spacing;
                c.position.z = Math.round(c.position.z / spacing) * spacing;

                c.rotation.x = Math.round(c.rotation.x / (Math.PI/2)) * (Math.PI/2);
                c.rotation.y = Math.round(c.rotation.y / (Math.PI/2)) * (Math.PI/2);
                c.rotation.z = Math.round(c.rotation.z / (Math.PI/2)) * (Math.PI/2);
            }

            scene.remove(pivot);
            rotating = false;
        }

        renderer.render(scene, camera);
    }

    requestAnimationFrame(animateRotation);
}

// -------------------- KEY CONTROLS --------------------
window.addEventListener("keydown", (e) => {
    switch (e.key.toUpperCase()) {
        case "R":
            rotateLayer("x", 1, -Math.PI / 2);
            break;
        case "L":
            rotateLayer("x", -1, Math.PI / 2);
            break;
        case "U":
            rotateLayer("y", 1, -Math.PI / 2);
            break;
        case "D":
            rotateLayer("y", -1, Math.PI / 2);
            break;
    }
});

// -------------------- RENDER LOOP --------------------
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

// -------------------- RESIZE --------------------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
