<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }
        #controls {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            font: 600 15px system-ui, -apple-system, sans-serif;
        }
        #sliders {
            position: fixed; top: 16px; left: 16px; z-index: 10;
            display: flex; flex-direction: column; gap: 10px;
            width: 180px;
            font: 600 15px system-ui, -apple-system, sans-serif;
        }
        .btn-row { display: flex; gap: 10px; }
        #controls button {
            padding: 10px 18px; font: inherit;
            color: #fff; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        #scrambleBtn { background: #339af0; }
        #scrambleBtn:hover { background: #1c7ed6; }
        #solveBtn { background: #51cf66; }
        #solveBtn:hover { background: #37b24d; }
        #controls button:disabled { background: #adb5bd; cursor: default; }
        #difficulty {
            padding: 8px 10px; font: inherit; color: #333;
            background: #fff; border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        #moves {
            max-width: 320px; padding: 10px 12px; border-radius: 8px;
            background: rgba(255,255,255,0.85); color: #333;
            font: 500 14px ui-monospace, "SF Mono", Menlo, monospace;
            line-height: 1.6; word-spacing: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        #moves:empty { display: none; }
        .slider {
            display: flex; flex-direction: column; gap: 5px;
            padding: 8px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.85); color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .slider label {
            display: flex; justify-content: space-between;
            font-size: 13px; font-weight: 600;
        }
        .slider input[type=range] {
            width: 100%; cursor: pointer; accent-color: #339af0; margin: 0;
        }
    </style>
</head>
<body>

<div id="controls">
    <div class="btn-row">
        <button id="scrambleBtn">Scramble</button>
        <button id="solveBtn">Solve</button>
    </div>
    <select id="difficulty">
        <option value="6">Easy</option>
        <option value="16" selected>Medium</option>
        <option value="30">Hard</option>
    </select>
    <div id="moves"></div>
</div>

<div id="sliders">
    <div class="slider">
        <label>Spin speed <span id="spinVal">3</span></label>
        <input id="spinSpeed" type="range" min="1" max="5" step="1" value="3">
    </div>
    <div class="slider">
        <label>Lighting <span id="lightVal">3</span></label>
        <input id="lighting" type="range" min="1" max="5" step="1" value="3">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.45);
fillLight.position.set(-10, -5, -15); // lights the faces turned away from the main light
scene.add(fillLight);

const spacing = 1.05;
const cubies = [];

function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];
                        
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    mesh.userData = { x, y, z };
    return mesh;
}

for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue;
            const c = createCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragStage = "IDLE"; 
let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let startMouse = new THREE.Vector2();
let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
let pivot = new THREE.Object3D();
let currentAngle = 0;

// --- Whole-cube orbit (camera) state ---
const spherical = new THREE.Spherical();
let ORBIT_SPEED = 0.012;      // how fast dragging spins the whole cube
let TURN_DRAG_SPEED = 0.005;  // how fast dragging turns an individual layer
// (both are set together by the Spin speed slider)
const PHI_EPS = 0.05; // keeps the camera from flipping at the poles

// --- Scramble / programmatic-turn state ---
let isBusy = false;     // locks mouse input while the cube is auto-turning
const turnQueue = [];   // pending { axis, layer, dir } moves to play out
let activeTurn = null;  // the turn currently being animated
const TURN_STEPS = 9;   // animation frames per 90° turn (smaller = faster)
const history = [];     // every turn taken (scramble + manual), for the solver to reverse
let pendingAxisKey = 'x'; // axis of the manual turn currently in progress
let pendingLayer = 0;     // which layer (-1/0/1) that manual turn is on

window.addEventListener("mousedown", (e) => {
    if (e.target !== renderer.domElement) return; // ignore clicks on UI (e.g. the button)
    if (isBusy) return;                           // ignore input while auto-turning
    if (dragStage !== "IDLE") return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);

    if (hits.length === 0) {
        // Clicked empty space -> orbit the entire cube (move the camera around it)
        dragStage = "ORBITING";
        startMouse.set(e.clientX, e.clientY);
        spherical.setFromVector3(camera.position);
        window.addEventListener("mousemove", handleOrbitDrag);
        return;
    }

    dragStage = "INITIATING";
    selectedCubie = hits[0].object;
    selectedFaceNormal.copy(hits[0].face.normal).applyQuaternion(selectedCubie.quaternion).normalize();
    startMouse.set(e.clientX, e.clientY);
});

window.addEventListener("mousemove", (e) => {
    if (dragStage !== "INITIATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 10) return;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

    const rawRotAxis = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();

    const axes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    let maxDot = -1;
    let bestAxis = new THREE.Vector3();

    axes.forEach(axis => {
        const dot = Math.abs(rawRotAxis.dot(axis));
        if (dot > maxDot) {
            maxDot = dot;
            bestAxis.copy(axis).multiplyScalar(Math.sign(rawRotAxis.dot(axis)));
        }
    });

    rotationAxis.copy(bestAxis);

    scene.add(pivot);
    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();

    let coordKey = 'x';
    if (Math.abs(rotationAxis.y) > 0.9) coordKey = 'y';
    if (Math.abs(rotationAxis.z) > 0.9) coordKey = 'z';

    const targetVal = Math.round(selectedCubie.position[coordKey] / spacing) * spacing;

    pendingAxisKey = coordKey;
    pendingLayer = Math.round(targetVal / spacing);

    rotationGroup = [];
    cubies.forEach(c => {
        const currentVal = Math.round(c.position[coordKey] / spacing) * spacing;
        if (Math.abs(currentVal - targetVal) < 0.1) {
            rotationGroup.push(c);
            pivot.attach(c);
        }
    });

    currentAngle = 0;
    dragStage = "ROTATING";
    window.addEventListener("mousemove", handleRotationDrag);
});

function handleRotationDrag(e) {
    if (dragStage !== "ROTATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);

    const tangentDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
    const dragAmt = dragWorldDir.dot(tangentDir);

    currentAngle = dragAmt * TURN_DRAG_SPEED;
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, currentAngle);
}

window.addEventListener("mouseup", () => {
    window.removeEventListener("mousemove", handleRotationDrag);
    window.removeEventListener("mousemove", handleOrbitDrag);
    
    if (dragStage !== "ROTATING") {
        dragStage = "IDLE";
        return;
    }

    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);

    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, snappedAngle);
    pivot.updateMatrixWorld();

    rotationGroup.forEach(c => {
        scene.attach(c);
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
    });

    scene.remove(pivot);
    rotationGroup = [];
    dragStage = "IDLE";

    // Record this manual turn so the solver can undo it later.
    // Express it as quarter turns about the POSITIVE axis (matching the turn engine).
    const s = Math.sign(rotationAxis[pendingAxisKey]) || 1;
    const n = Math.round(snappedAngle * s / (Math.PI / 2)); // signed # of quarter turns
    if (n !== 0) {
        const dir = n > 0 ? 1 : -1;
        for (let i = 0; i < Math.abs(n); i++) {
            history.push({ axis: pendingAxisKey, layer: pendingLayer, dir });
        }
        refreshButtons();
    }
});

function handleOrbitDrag(e) {
    if (dragStage !== "ORBITING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    startMouse.set(e.clientX, e.clientY); // incremental delta each frame

    spherical.theta -= dx * ORBIT_SPEED;
    spherical.phi   -= dy * ORBIT_SPEED;
    spherical.phi = Math.max(PHI_EPS, Math.min(Math.PI - PHI_EPS, spherical.phi));

    camera.position.setFromSpherical(spherical);
    camera.lookAt(0, 0, 0);
}

// Start the next queued turn (or release the lock when the queue is empty)
function startNextTurn() {
    if (activeTurn) return;
    if (turnQueue.length === 0) {
        isBusy = false;
        refreshButtons();
        return;
    }

    const move = turnQueue.shift();
    const axisVec = new THREE.Vector3(
        move.axis === 'x' ? 1 : 0,
        move.axis === 'y' ? 1 : 0,
        move.axis === 'z' ? 1 : 0
    );

    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();
    scene.add(pivot);

    // Grab every cubie sitting in the layer we're about to turn
    const group = [];
    cubies.forEach(c => {
        const layerVal = Math.round(c.position[move.axis] / spacing);
        if (layerVal === move.layer) {
            group.push(c);
            pivot.attach(c);
        }
    });

    activeTurn = {
        axisVec,
        group,
        target: move.dir * (Math.PI / 2),
        done: 0,
        stepMag: (Math.PI / 2) / TURN_STEPS
    };
}

// Advance the current turn a little each frame; snap & finish when it hits 90°
function updateTurn() {
    if (!activeTurn) return;
    const t = activeTurn;
    const dir = Math.sign(t.target);

    let next = t.done + dir * t.stepMag;
    if (Math.abs(next) >= Math.abs(t.target)) next = t.target; // clamp to exact 90°
    t.done = next;

    pivot.rotation.set(0, 0, 0);
    pivot.rotateOnAxis(t.axisVec, t.done);

    if (t.done === t.target) {
        pivot.updateMatrixWorld();
        t.group.forEach(c => {
            scene.attach(c);
            c.position.x = Math.round(c.position.x / spacing) * spacing;
            c.position.y = Math.round(c.position.y / spacing) * spacing;
            c.position.z = Math.round(c.position.z / spacing) * spacing;
        });
        scene.remove(pivot);
        pivot.rotation.set(0, 0, 0);
        activeTurn = null;
        startNextTurn(); // chain into the next queued turn
    }
}

// --- Move notation (standard cube notation: R, U, F', L2, etc.) ---
// Map an internal turn {axis, layer} to its face letter.
const FACE = {
    'x1': 'R', 'x-1': 'L', 'x0': 'M',
    'y1': 'U', 'y-1': 'D', 'y0': 'E',
    'z1': 'F', 'z-1': 'B', 'z0': 'S'
};
// For each face, +1 = one clockwise (unprimed) turn given an internal dir.
const FACE_SIGN = { R:-1, U:-1, F:-1, L:1, D:1, B:1, M:1, E:1, S:-1 };

// Convert a list of {axis,layer,dir} moves into notation tokens like ["R","U'","F2"].
function toNotation(moves) {
    const tokens = [];
    let i = 0;
    while (i < moves.length) {
        const face = FACE[`${moves[i].axis}${moves[i].layer}`];
        let count = 0;
        // collapse a run of turns on the same face into one token
        while (i < moves.length && FACE[`${moves[i].axis}${moves[i].layer}`] === face) {
            count += FACE_SIGN[face] * moves[i].dir;
            i++;
        }
        const n = ((count % 4) + 4) % 4; // net quarter turns, 0..3
        if (n === 1) tokens.push(face);
        else if (n === 2) tokens.push(face + '2');
        else if (n === 3) tokens.push(face + "'");
        // n === 0: the turns cancelled out, emit nothing
    }
    return tokens;
}

function showMoves(label, moves) {
    const seq = toNotation(moves);
    movesEl.textContent = seq.length ? `${label}: ${seq.join('  ')}` : `${label}: (none)`;
}

// Queue a random scramble of `moves` outer-face turns. Always solvable.
function scramble(moves) {
    if (isBusy || dragStage !== "IDLE") return; // don't interrupt an in-progress turn
    isBusy = true;
    refreshButtons();

    const axes = ['x', 'y', 'z'];
    const layers = [-1, 1]; // outer faces only, so the notation reads like a real scramble
    let lastAxis = null;
    const generated = [];

    for (let i = 0; i < moves; i++) {
        let axis;
        do { axis = axes[Math.floor(Math.random() * 3)]; } while (axis === lastAxis);
        lastAxis = axis; // avoid back-to-back turns on the same axis
        const layer = layers[Math.floor(Math.random() * 2)];
        const dir = Math.random() < 0.5 ? 1 : -1;
        const move = { axis, layer, dir };
        turnQueue.push(move);
        history.push(move);   // remember it so Solve can reverse it
        generated.push(move);
    }
    showMoves('Scramble', generated);
    startNextTurn();
}

const scrambleBtn = document.getElementById('scrambleBtn');
const solveBtn = document.getElementById('solveBtn');
const difficultyEl = document.getElementById('difficulty');
const movesEl = document.getElementById('moves');
const spinSpeedEl = document.getElementById('spinSpeed');
const spinValEl = document.getElementById('spinVal');
const lightingEl = document.getElementById('lighting');
const lightValEl = document.getElementById('lightVal');

// True when every cubie is back in its home position AND its home orientation,
// regardless of how it got there. This is the real "is the cube solved?" test.
function isSolved() {
    return cubies.every(c => {
        const inPlace =
            Math.abs(c.position.x - c.userData.x * spacing) < 0.05 &&
            Math.abs(c.position.y - c.userData.y * spacing) < 0.05 &&
            Math.abs(c.position.z - c.userData.z * spacing) < 0.05;
        // |quaternion.w| ~ 1 means the cubie is unrotated (its starting orientation)
        const upright = Math.abs(c.quaternion.w) > 0.9999;
        return inPlace && upright;
    });
}

function refreshButtons() {
    const solved = isSolved();
    if (solved) history.length = 0; // once solved, prior moves are irrelevant — forget them
    scrambleBtn.disabled = isBusy;
    solveBtn.disabled = isBusy || solved;
}

// Solve by replaying every recorded turn in reverse order, each one inverted.
// Undoing the full move history always returns the cube to solved.
function solve() {
    if (isBusy || dragStage !== "IDLE" || isSolved()) return;
    isBusy = true;
    refreshButtons();

    const sequence = [];
    for (let i = history.length - 1; i >= 0; i--) {
        const m = history[i];
        sequence.push({ axis: m.axis, layer: m.layer, dir: -m.dir });
    }
    showMoves('Solve', sequence);
    sequence.forEach(m => turnQueue.push(m));
    history.length = 0; // the queued turns bring us back to solved
    startNextTurn();
}

scrambleBtn.addEventListener('click', () => scramble(parseInt(difficultyEl.value, 10)));
solveBtn.addEventListener('click', solve);
refreshButtons();

// Spin speed: level 1-5 sets how fast dragging spins the whole cube AND turns a layer
function setSpinSpeed(level) {
    ORBIT_SPEED = level * 0.004;       // whole-cube orbit
    TURN_DRAG_SPEED = level * 0.0017;  // individual layer (level 3 ~ original 0.005)
    spinValEl.textContent = level;
}
// Lighting: level 1-5 scales all three lights (level 3 = the default brightness)
function setLighting(level) {
    const f = level / 3;
    ambientLight.intensity = 0.95 * f;
    dirLight.intensity = 0.85 * f;
    fillLight.intensity = 0.45 * f;
    lightValEl.textContent = level;
}
spinSpeedEl.addEventListener('input', e => setSpinSpeed(parseInt(e.target.value, 10)));
lightingEl.addEventListener('input', e => setLighting(parseInt(e.target.value, 10)));
setSpinSpeed(parseInt(spinSpeedEl.value, 10));
setLighting(parseInt(lightingEl.value, 10));

function animate() {
    requestAnimationFrame(animate);
    updateTurn();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
