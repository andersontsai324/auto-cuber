<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e9ecef;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        h1 {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            margin: 0;
            font-size: 28px;
            color: #222;
            z-index: 10;
        }
    </style>
</head>

<body>

<h1>Auto Cuber</h1>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9ecef); // light background

    // Camera
    const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
    camera.position.set(3, 3, 5);
    camera.lookAt(0, 0, 0);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Rubik's Cube colors (face order matters!)
    const materials = [
        new THREE.MeshBasicMaterial({ color: 0xff0000 }), // right  (+x) red
        new THREE.MeshBasicMaterial({ color: 0xffa500 }), // left   (-x) orange
        new THREE.MeshBasicMaterial({ color: 0xffffff }), // top    (+y) white
        new THREE.MeshBasicMaterial({ color: 0xffff00 }), // bottom (-y) yellow
        new THREE.MeshBasicMaterial({ color: 0x00ff00 }), // front  (+z) green
        new THREE.MeshBasicMaterial({ color: 0x0000ff })  // back   (-z) blue
    ];

    // Cube
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const cube = new THREE.Mesh(geometry, materials);
    scene.add(cube);

    // Render once (no animation / no rotation)
    renderer.render(scene, camera);

    // Resize support
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.render(scene, camera);
    });
</script>

</body>
</html>
