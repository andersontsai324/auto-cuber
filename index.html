<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting to give depth to the faces
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const spacing = 1.05;
const cubies = [];

// Helper function to create black borders around the colors
function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];
    
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    
    // Store original grid coordinates for identity tracking
    mesh.userData = { x, y, z };
    return mesh;
}

// Build 3x3x3 Rubik's Cube
for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue; // Skip core
            const c = createCubie(x, y, z);
            scene.add(c);
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;
let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let intersectionPoint = new THREE.Vector3();

let startMouse = new THREE.Vector2();
let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
let pivot = new THREE.Object3D();

window.addEventListener("mousedown", (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);
    
    if (hits.length === 0) return;
    
    dragging = true;
    selectedCubie = hits[0].object;
    // Get world face normal
    selectedFaceNormal.copy(hits[0].face.normal).applyQuaternion(selectedCubie.quaternion).normalize();
    intersectionPoint.copy(hits[0].point);
    startMouse.set(e.clientX, e.clientY);
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    // Threshold to determine intent of drag direction
    if (distance < 10) return; 

    // Calculate camera movement vectors in world space
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

    // The rotation vector is perpendicular to both the clicked face normal and the drag direction
    const rotAxisProj = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();

    // Snap the calculated rotation vector to the closest world base axis (X, Y, or Z)
    let maxDot = -1;
    const worldAxes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    let bestAxis = worldAxes[0];

    worldAxes.forEach(axis => {
        let dot = Math.abs(rotAxisProj.dot(axis));
        if (dot > maxDot) {
            maxDot = dot;
            bestAxis = axis;
        }
    });

    rotationAxis.copy(bestAxis);

    // Find which slice should move based on the selected axis position
    scene.add(pivot);
    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();

    const targetPosVal = selectedCubie.position.dot(rotationAxis);
    rotationGroup = [];

    cubies.forEach(c => {
        const cPosVal = c.position.dot(rotationAxis);
        // Grab all cubies sharing that cross-section layer
        if (Math.abs(cPosVal - targetPosVal) < 0.2) {
            rotationGroup.push(c);
            pivot.attach(c);
        }
    });

    // Switch tracking to a temporary drag update listener
    dragging = false;
    window.addEventListener("mousemove", handleRotationDrag);
});

function handleRotationDrag(e) {
    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);

    // Compute rotation angle speed based on projection along rotation path
    const tangentDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
    const dragAmt = dragWorldDir.dot(tangentDir);
    
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, dragAmt * 0.005);
}

window.addEventListener("mouseup", () => {
    // Remove the temporary move tracker if it was set
    window.removeEventListener("mousemove", handleRotationDrag);
    dragging = false;

    if (rotationGroup.length === 0) return;

    // Grab current angle on the active axis and snap it cleanly to 90 degrees (PI / 2)
    const currentAngle = pivot.rotation.x + pivot.rotation.y + pivot.rotation.z; 
    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);
    
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, snappedAngle);
    pivot.updateMatrixWorld();

    // Detach cubies from the pivot and freeze their positions back into world space
    rotationGroup.forEach(c => {
        scene.attach(c);
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
        // Do NOT overwrite c.rotation with zeroes; let Three.js maintain its new matrix!
    });

    scene.remove(pivot);
    rotationGroup = [];
});

// Animation Loop
function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
