<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber!</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }

        /* Joystick HUD elements */
        #joystick-base {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            z-index: 10;
        }
        #joystick-stick {
            width: 50px;
            height: 50px;
            background: #212529;
            border-radius: 50%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: grab;
            transition: transform 0.05s ease-out;
        }
        #joystick-stick:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

<div id="joystick-base">
    <div id="joystick-stick"></div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const spacing = 1.05;
const cubies = [];

// Global container to allow rotating the entire structure at once
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];
        
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    mesh.userData = { x, y, z };
    return mesh;
}

for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue;
            const c = createCubie(x, y, z);
            cubeGroup.add(c); // Added to group container instead of scene
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragging = false;
let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let intersectionPoint = new THREE.Vector3();

let startMouse = new THREE.Vector2();
let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
let pivot = new THREE.Object3D();

// Slice Manipulation Listeners
window.addEventListener("mousedown", (e) => {
    // Block cube layer interaction if user clicks directly on the joystick UI zone
    if (e.target.closest('#joystick-base')) return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);
        
    if (hits.length === 0) return;
        
    dragging = true;
    selectedCubie = hits[0].object;
    selectedFaceNormal.copy(hits[0].face.normal).applyQuaternion(selectedCubie.quaternion).normalize();
    intersectionPoint.copy(hits[0].point);
    startMouse.set(e.clientX, e.clientY);
});

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
        
    if (distance < 10) return; 
     
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

    const rotAxisProj = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();
     
    let maxDot = -1;
    const worldAxes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    let bestAxis = worldAxes[0];

    worldAxes.forEach(axis => {
        let dot = Math.abs(rotAxisProj.dot(axis));
        if (dot > maxDot) {
            maxDot = dot;
            bestAxis = axis;
        }
    });

    rotationAxis.copy(bestAxis);

    cubeGroup.add(pivot); // Pivot binds inside the global group transformation matrix
    pivot.position.set(0, 0, 0);
    pivot.rotation.set(0, 0, 0);
    pivot.updateMatrixWorld();

    const targetPosVal = selectedCubie.position.dot(rotationAxis);
    rotationGroup = [];

    cubies.forEach(c => {
        const cPosVal = c.position.dot(rotationAxis);
        if (Math.abs(cPosVal - targetPosVal) < 0.2) {
            rotationGroup.push(c);
            pivot.attach(c);
        }
    });

    dragging = false;
    window.addEventListener("mousemove", handleRotationDrag);
});

function handleRotationDrag(e) {
    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);

    const tangentDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
    const dragAmt = dragWorldDir.dot(tangentDir);
        
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, dragAmt * 0.005);
}

window.addEventListener("mouseup", () => {
    window.removeEventListener("mousemove", handleRotationDrag);
    dragging = false;

    if (rotationGroup.length === 0) return;

    const currentAngle = pivot.rotation.x + pivot.rotation.y + pivot.rotation.z;
    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);
        
    pivot.rotation.set(0,0,0);
    pivot.rotateOnAxis(rotationAxis, snappedAngle);
    pivot.updateMatrixWorld();

    rotationGroup.forEach(c => {
        cubeGroup.attach(c); // Return elements cleanly to parent cubeGroup space
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
    });

    cubeGroup.remove(pivot);
    rotationGroup = [];
});

// Joystick UI Controller Logic
const base = document.getElementById('joystick-base');
const stick = document.getElementById('joystick-stick');

let joystickActive = false;
let joystickStart = { x: 0, y: 0 };
let joystickMove = { x: 0, y: 0 };
const maxRadius = 45; 

const baseSpeed = 0.0006;

function handleJoystickStart(e) {
    joystickActive = true;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    
    joystickStart = { x: clientX, y: clientY };
    e.stopPropagation(); 
}

function handleJoystickMove(e) {
    if (!joystickActive) return;
    
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (!clientX || !clientY) return;

    let dx = clientX - joystickStart.x;
    let dy = clientY - joystickStart.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > maxRadius) {
        dx = (dx / distance) * maxRadius;
        dy = (dy / distance) * maxRadius;
    }

    stick.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickMove = { x: dx, y: dy };
}

function handleJoystickEnd() {
    if (!joystickActive) return;
    joystickActive = false;
    stick.style.transform = 'translate(0px, 0px)';
    joystickMove = { x: 0, y: 0 };
}

base.addEventListener('mousedown', handleJoystickStart);
window.addEventListener('mousemove', handleJoystickMove);
window.addEventListener('mouseup', handleJoystickEnd);

base.addEventListener('touchstart', handleJoystickStart, { passive: false });
window.addEventListener('touchmove', handleJoystickMove, { passive: false });
window.addEventListener('touchend', handleJoystickEnd);

// Main Engine Loop
function animate() {
    requestAnimationFrame(animate);

    // Apply continuous whole-cube orientation mapping while joystick is shifted
    if (joystickActive) {
        cubeGroup.rotation.y += joystickMove.x * baseSpeed;
        cubeGroup.rotation.x += joystickMove.y * baseSpeed;
    }

    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
