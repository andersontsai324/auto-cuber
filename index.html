<!DOCTYPE html>
<html>
<head>
    <title>Auto Cuber</title>
    <style>
        body { margin:0; overflow:hidden; background:#e9ecef; user-select: none; }
        canvas { display:block; }
    </style>
</head>
<body>

<script src="https://cloudflare.com"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecef);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(10, 20, 15);
scene.add(dirLight);

const spacing = 1.05;
const cubies = [];

const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

function createCubie(x, y, z) {
    const geo = new THREE.BoxGeometry(1, 1, 1);
    const mats = [
        new THREE.MeshLambertMaterial({color: 0xff0000}), // Right (Red)
        new THREE.MeshLambertMaterial({color: 0xffa500}), // Left (Orange)
        new THREE.MeshLambertMaterial({color: 0xffffff}), // Top (White)
        new THREE.MeshLambertMaterial({color: 0xffff00}), // Bottom (Yellow)
        new THREE.MeshLambertMaterial({color: 0x00ff00}), // Front (Green)
        new THREE.MeshLambertMaterial({color: 0x0000ff})  // Back (Blue)
    ];
                  
    const mesh = new THREE.Mesh(geo, mats);
    mesh.position.set(x * spacing, y * spacing, z * spacing);
    mesh.userData = { x, y, z };
    return mesh;
}

for(let x = -1; x <= 1; x++) {
    for(let y = -1; y <= 1; y++) {
        for(let z = -1; z <= 1; z++) {
            if(x === 0 && y === 0 && z === 0) continue;
            const c = createCubie(x, y, z);
            cubeGroup.add(c);
            cubies.push(c);
        }
    }
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let dragStage = "IDLE"; 
let selectedCubie = null;
let selectedFaceNormal = new THREE.Vector3();
let startMouse = new THREE.Vector2();
let lastMouse = new THREE.Vector2();

let rotationAxis = new THREE.Vector3();
let rotationGroup = [];
let pivot = new THREE.Object3D();
let currentAngle = 0;

window.addEventListener("mousedown", (e) => {
    if (dragStage !== "IDLE") return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                  
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cubies);
                  
    startMouse.set(e.clientX, e.clientY);
    lastMouse.set(e.clientX, e.clientY);

    if (hits.length === 0) {
        dragStage = "ORBIT";
        return;
    }
                  
    dragStage = "INITIATING";
    
    // FIXED: Properly accessing array index [0] so the application doesn't crash
    selectedCubie = hits[0].object; 
    selectedFaceNormal.copy(hits[0].face.normal).applyQuaternion(selectedCubie.quaternion).normalize();
});

window.addEventListener("mousemove", (e) => {
    if (dragStage === "ORBIT") {
        const deltaX = e.clientX - lastMouse.x;
        const deltaY = e.clientY - lastMouse.y;

        cubeGroup.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), deltaX * 0.005);
        cubeGroup.rotateOnWorldAxis(new THREE.Vector3(1, 0, 0), deltaY * 0.005);

        lastMouse.set(e.clientX, e.clientY);
        return;
    }

    if (dragStage !== "INITIATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
                  
    if (distance < 10) return;
                
    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion).normalize();
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy).normalize();

    const rotAxisProj = new THREE.Vector3().crossVectors(selectedFaceNormal, dragWorldDir).normalize();
               
    let maxDot = -1;
    const rawAxes = [new THREE.Vector3(1,0,0), new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,1)];
    let bestAxis = rawAxes[0];

    rawAxes.forEach(axis => {
        let transformedAxis = axis.clone().applyQuaternion(cubeGroup.quaternion).normalize();
        let dot = Math.abs(rotAxisProj.dot(transformedAxis));
        if (dot > maxDot) {
            maxDot = dot;
            bestAxis = transformedAxis;
        }
    });

    rotationAxis.copy(bestAxis);

    pivot.quaternion.copy(cubeGroup.quaternion);
    scene.add(pivot);
    pivot.updateMatrixWorld();

    const targetWorldPos = new THREE.Vector3();
    selectedCubie.getWorldPosition(targetWorldPos);
    const targetPosVal = targetWorldPos.dot(rotationAxis);
    rotationGroup = [];

    cubies.forEach(c => {
        const cWorldPos = new THREE.Vector3();
        c.getWorldPosition(cWorldPos);
        const cPosVal = cWorldPos.dot(rotationAxis);
        if (Math.abs(cPosVal - targetPosVal) < 0.2) {
            rotationGroup.push(c);
            pivot.attach(c);
        }
    });

    currentAngle = 0;
    dragStage = "ROTATING";
    window.addEventListener("mousemove", handleRotationDrag);
});

function handleRotationDrag(e) {
    if (dragStage !== "ROTATING") return;

    const dx = e.clientX - startMouse.x;
    const dy = e.clientY - startMouse.y;

    const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const camUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const dragWorldDir = new THREE.Vector3().addScaledVector(camRight, dx).addScaledVector(camUp, -dy);

    const tangentDir = new THREE.Vector3().crossVectors(rotationAxis, selectedFaceNormal).normalize();
    const dragAmt = dragWorldDir.dot(tangentDir);
                  
    currentAngle = dragAmt * 0.005;
    
    pivot.quaternion.copy(cubeGroup.quaternion);
    pivot.rotateOnAxis(pivot.worldToLocal(rotationAxis.clone()).normalize(), currentAngle);
}

window.addEventListener("mouseup", () => {
    window.removeEventListener("mousemove", handleRotationDrag);
              
    if (dragStage === "ORBIT") {
        dragStage = "IDLE";
        return;
    }

    if (dragStage !== "ROTATING") {
        dragStage = "IDLE";
        return;
    }

    const snappedAngle = Math.round(currentAngle / (Math.PI / 2)) * (Math.PI / 2);
                  
    pivot.quaternion.copy(cubeGroup.quaternion);
    pivot.rotateOnAxis(pivot.worldToLocal(rotationAxis.clone()).normalize(), snappedAngle);
    pivot.updateMatrixWorld();

    const tempGroup = [];
    while(rotationGroup.length > 0) {
        let c = rotationGroup.pop();
        cubeGroup.attach(c);
        tempGroup.push(c);
    }

    tempGroup.forEach(c => {
        c.position.x = Math.round(c.position.x / spacing) * spacing;
        c.position.y = Math.round(c.position.y / spacing) * spacing;
        c.position.z = Math.round(c.position.z / spacing) * spacing;
    });

    scene.remove(pivot);
    dragStage = "IDLE";
});

function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
